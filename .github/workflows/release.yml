name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    env:
      CXX: g++-15
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MPMC_TOOL_DIR: ${{ runner.temp }}/mpmc-tools
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install pinned CMake
        run: ./ci/install-tools.sh cmake

      - name: Verify toolchain
        run: ./ci/verify-toolchain.sh gcc cmake python pkg-config jq gh

      - name: Validate tag and version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual release dispatch must run from main."
            exit 1
          fi
          git fetch --force --tags origin
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_type="$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || true)"
          if [[ "$tag_type" != "tag" ]]; then
            echo "::error::Release tag $TAG must be an annotated tag."
            exit 1
          fi
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [[ "$commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Checkout did not resolve to the release tag commit."
            exit 1
          fi
          version="$(python3 tools/release.py check "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Release $TAG: version $version at $commit"

      - name: Require green CI for the tagged commit
        shell: bash
        env:
          COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while true; do
            runs="$(gh run list \
              --workflow=ci.yml \
              --event=push \
              --branch=main \
              --commit="$COMMIT" \
              --limit=1 \
              --json status,conclusion,databaseId,headSha,url)"
            if [[ "$runs" == "[]" ]]; then
              if (( SECONDS >= deadline )); then
                echo "::error::No main-branch CI run appeared for $COMMIT."
                exit 1
              fi
              echo "No CI run yet; waiting."
              sleep 15
              continue
            fi
            head_sha="$(jq -r '.[0].headSha // ""' <<<"$runs")"
            if [[ "$head_sha" != "$COMMIT" ]]; then
              echo "::error::CI query returned $head_sha, expected $COMMIT."
              exit 1
            fi
            status="$(jq -r '.[0].status' <<<"$runs")"
            conclusion="$(jq -r '.[0].conclusion // ""' <<<"$runs")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "CI succeeded for $COMMIT."
                exit 0
              fi
              echo "::error::CI concluded $conclusion for $COMMIT."
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::CI did not finish within 15 minutes."
              exit 1
            fi
            echo "CI is $status; waiting."
            sleep 15
          done

      - name: Build release notes and archives
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-bundle/assets
          python3 tools/release.py notes "$TAG" release-bundle/notes.md
          python3 tools/release.py package "$TAG" release-bundle/assets
          test -s release-bundle/notes.md
          (
            cd release-bundle/assets
            sha256sum -c SHA256SUMS
          )

      - name: Verify source archive
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-source"
          rm -rf "$root"
          mkdir -p "$root"
          tar -xzf "release-bundle/assets/mpmc_queue-$VERSION.tar.gz" -C "$root"
          source_tree="$root/mpmc_queue-$VERSION"
          test -f "$source_tree/CMakeLists.txt"
          cmake -S "$source_tree" -B "$root/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DMPMC_BUILD_TESTS=ON \
            -DMPMC_BUILD_EXAMPLES=ON \
            -DMPMC_BUILD_BENCHMARKS=OFF
          cmake --build "$root/build" --parallel
          ctest --test-dir "$root/build" --output-on-failure
          cmake --install "$root/build" --prefix "$root/install"
          docdir="$root/install/share/doc/mpmc_queue"
          test -f "$docdir/LICENSE"
          test -f "$docdir/NOTICE"
          test -f "$docdir/CHANGELOG.md"
          test -f "$docdir/LICENSES/CPAL-1.0.txt"
          test -f "$docdir/LICENSES/MIT.txt"
          cmake -S "$source_tree/tests/package_consumer" -B "$root/consumer" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_PREFIX_PATH="$root/install"
          cmake --build "$root/consumer" --parallel
          "$root/consumer/mpmc_package_consumer"
          if [[ -x "$root/consumer/mpmc_package_consumer_16" ]]; then
            "$root/consumer/mpmc_package_consumer_16"
          fi
          pc_file="$(find "$root/install" -name mpmc_queue.pc -print -quit)"
          export PKG_CONFIG_PATH="$(dirname "$pc_file")"
          test "$(pkg-config --modversion mpmc_queue)" = "$VERSION"
          "${CXX}" -std=c++20 "$source_tree/tests/package_consumer/main.cpp" \
            $(pkg-config --cflags --libs mpmc_queue) \
            -o "$root/pkg-consumer"
          "$root/pkg-consumer"

      - name: Verify headers archive
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-headers"
          rm -rf "$root"
          mkdir -p "$root"
          tar -xzf "release-bundle/assets/mpmc_queue-$VERSION-headers.tar.gz" \
            -C "$root"
          headers="$root/mpmc_queue-$VERSION"
          test -f "$headers/include/mpmc/mpmc.hpp"
          test -f "$headers/LICENSE"
          test -f "$headers/NOTICE"
          test -f "$headers/CHANGELOG.md"
          test -f "$headers/LICENSES/CPAL-1.0.txt"
          test -f "$headers/LICENSES/MIT.txt"
          test -f "$headers/docs/design.md"
          test -f "$headers/verification/README.md"
          test -f "$headers/benchmarks/comparison/RESULTS.md"
          "${CXX}" -std=c++20 "$GITHUB_WORKSPACE/tests/package_consumer/main.cpp" \
            -I"$headers/include" -pthread -lrt \
            -o "$root/header-consumer"
          "$root/header-consumer"

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Check bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s release-bundle/notes.md
          (
            cd release-bundle/assets
            sha256sum -c SHA256SUMS
          )
          test -f "release-bundle/assets/mpmc_queue-$VERSION.tar.gz"
          test -f "release-bundle/assets/mpmc_queue-$VERSION-headers.tar.gz"
          test -f "release-bundle/assets/SHA256SUMS"

      - name: Verify remote tag
        shell: bash
        run: |
          set -euo pipefail
          ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")"
          test "$(jq -r .object.type <<<"$ref")" = tag
          tag_sha="$(jq -r .object.sha <<<"$ref")"
          tag_object="$(gh api "repos/$GH_REPO/git/tags/$tag_sha")"
          test "$(jq -r .object.type <<<"$tag_object")" = commit
          test "$(jq -r .object.sha <<<"$tag_object")" = "$COMMIT"

      - name: Create and publish release
        shell: bash
        run: |
          set -euo pipefail
          release_state() {
            local error_file value status
            error_file="$(mktemp)"
            set +e
            value="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$error_file")"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              rm -f "$error_file"
              printf '%s\n' "$value"
              return 0
            fi
            if grep -qi 'release not found' "$error_file"; then
              rm -f "$error_file"
              return 0
            fi
            cat "$error_file" >&2
            rm -f "$error_file"
            return 1
          }
          if ! existing="$(release_state)"; then
            echo "::error::Could not determine whether $TAG already exists; refusing to modify it."
            exit 1
          fi
          if [[ "$existing" == "true" ]]; then
            echo "Removing incomplete draft release for $TAG."
            gh release delete "$TAG" --yes
          elif [[ "$existing" == "false" ]]; then
            echo "::error::Published release $TAG already exists; refusing to modify it."
            exit 1
          elif [[ -n "$existing" ]]; then
            echo "::error::Unexpected release state for $TAG: $existing"
            exit 1
          fi
          if ! gh release create "$TAG" \
            "release-bundle/assets/mpmc_queue-$VERSION.tar.gz" \
            "release-bundle/assets/mpmc_queue-$VERSION-headers.tar.gz" \
            "release-bundle/assets/SHA256SUMS" \
            --draft \
            --verify-tag \
            --title "mpmc_queue $VERSION" \
            --notes-file release-bundle/notes.md; then
            echo "::error::Could not create the release draft."
            if state="$(release_state)" && [[ "$state" == "true" ]]; then
              gh release delete "$TAG" --yes >/dev/null 2>&1 || true
            fi
            exit 1
          fi
          expected_names="$(printf '%s\n' \
            "SHA256SUMS" \
            "mpmc_queue-$VERSION.tar.gz" \
            "mpmc_queue-$VERSION-headers.tar.gz" | LC_ALL=C sort)"
          asset_names=""
          for _ in {1..20}; do
            asset_names="$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
            if [[ "$asset_names" == "$expected_names" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$asset_names" != "$expected_names" ]]; then
            echo "::error::Release draft assets do not match the expected set."
            gh release delete "$TAG" --yes
            exit 1
          fi
          if ! gh release edit "$TAG" --draft=false; then
            echo "::error::Draft $TAG remains unpublished; delete it before retrying."
            exit 1
          fi
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)" = "$expected_names"
